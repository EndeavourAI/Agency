name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The root package.json version is the only release switch: a merge to master without a bump stops here.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.gate.outputs.version }}
      build: ${{ steps.gate.outputs.build }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Decide
        id: gate
        run: bun scripts/npm-release.ts gate

  build:
    name: build (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: bun-linux-x64,bun-linux-arm64,bun-linux-x64-musl,bun-linux-arm64-musl
            sign_os: linux
          - os: macos-latest
            targets: bun-darwin-x64,bun-darwin-arm64
            sign_os: darwin
          - os: windows-latest
            targets: bun-windows-x64
            sign_os: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Job-level so the sign steps' `if` conditions can test presence.
    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
      WINDOWS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
      LINUX_SIGN_KEY: ${{ secrets.LINUX_SIGN_KEY }}
      AGENCY_UPDATE_PRIVATE_KEY: ${{ secrets.AGENCY_UPDATE_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # Not `bun test`: one process for all tests does not finish on Windows.
      - name: Test
        run: bun run test:ci
      - name: Derive version
        shell: bash
        run: echo "VERSION=${{ needs.gate.outputs.version }}" >> "$GITHUB_ENV"
      - name: Derive update public key
        # Production binaries must embed the production public key at compile
        # time (scripts/build.ts inlines AGENCY_UPDATE_PUBLIC_KEY via --define).
        # Deriving it from the private-key secret keeps a single secret as the
        # source of truth; without the secret the dev key applies (dev only).
        if: env.AGENCY_UPDATE_PRIVATE_KEY != ''
        shell: bash
        env:
          AGENCY_UPDATE_PRIVATE_KEY: ${{ secrets.AGENCY_UPDATE_PRIVATE_KEY }}
        run: |
          echo "AGENCY_UPDATE_PUBLIC_KEY=$(bun scripts/sign-release.ts --derive-public-key)" >> "$GITHUB_ENV"
      - name: Build binaries
        shell: bash
        run: bun scripts/build.ts --targets "${{ matrix.targets }}" --version "$VERSION" --outdir dist
      - name: Sign binaries (macOS)
        if: matrix.sign_os == 'darwin' && env.MACOS_SIGN_IDENTITY != ''
        shell: bash
        run: |
          for f in dist/agency-*; do
            bash scripts/sign.sh --os darwin --file "$f"
          done
      - name: Sign binaries (Windows)
        if: matrix.sign_os == 'windows' && env.WINDOWS_SIGN_THUMBPRINT != ''
        shell: pwsh
        run: |
          Get-ChildItem dist/agency-* | ForEach-Object {
            & scripts/sign.ps1 -Path $_.FullName
          }
      - name: Sign binaries (Linux)
        if: matrix.sign_os == 'linux' && env.LINUX_SIGN_KEY != ''
        shell: bash
        run: |
          echo "$LINUX_SIGN_KEY" > signing.key
          for f in dist/agency-*; do
            bash scripts/sign.sh --os linux --file "$f" --key signing.key
          done
          rm -f signing.key
      - name: Sign release artifacts (ed25519)
        if: env.AGENCY_UPDATE_PRIVATE_KEY != ''
        shell: bash
        env:
          AGENCY_UPDATE_PRIVATE_KEY: ${{ secrets.AGENCY_UPDATE_PRIVATE_KEY }}
        run: |
          for f in dist/agency-*; do
            case "$f" in
              *.sig|*checksums-signed*) continue ;;
            esac
            bun scripts/sign-release.ts --file "$f"
          done
          # Per-OS fragment: merge-multiple would let same-named
          # checksums-signed.txt files overwrite each other on download.
          cp dist/checksums-signed.txt "dist/checksums-signed-${{ matrix.sign_os }}.txt"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agency-${{ matrix.sign_os }}
          path: |
            dist/agency-*
            dist/checksums-signed-*.txt
          if-no-files-found: error

  sbom:
    name: sbom
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate SBOM
        run: bun scripts/sbom.ts --out dist/agency.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/agency.cdx.json
          if-no-files-found: error

  release:
    name: release
    if: needs.gate.outputs.publish == 'true'
    needs: [gate, build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reviewers added to this environment in the repo settings gate the publish.
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships older.
      - name: Update npm
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Pack npm tarballs
        run: |
          mkdir dist
          cp artifacts/agency-* dist/
          bun scripts/npm-pack.ts --version "${{ needs.gate.outputs.version }}" --skip-build --tarballs
          # A binary without the execute bit cannot run from a root-owned global install.
          for t in dist/npm/tarballs/*.tgz; do
            tar -tzvf "$t" | awk '$NF ~ /bin\/agency(\.js)?$/ && $1 != "-rwxr-xr-x" { bad = 1; print "not 755: " $0 } END { exit bad }'
          done
      - name: Publish to npm
        # OIDC when the secret is empty; a first publish of a new package needs the token.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/npm-release.ts publish --dir dist/npm/tarballs
      - name: Generate checksums
        run: |
          cd artifacts
          # Merge per-OS signed checksum fragments into the single manifest
          # the update client fetches as checksums-signed.txt.
          # Without AGENCY_UPDATE_PRIVATE_KEY there are no fragments: the
          # release still goes out, and `agency update` refuses it.
          if ls checksums-signed-*.txt >/dev/null 2>&1; then
            cat checksums-signed-*.txt > checksums-signed.txt
            rm -f checksums-signed-*.txt
          else
            echo "::warning::no signed checksums: AGENCY_UPDATE_PRIVATE_KEY is not set, so 'agency update' will refuse this release"
          fi
          # checksums.txt covers install payloads only (binaries + SBOM),
          # never the detached .sig sidecars or the signed manifest itself.
          sha256sum $(ls agency-* | grep -v '\.sig$') agency.cdx.json > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.gate.outputs.version }}
        run: |
          # Release carries the binaries, their detached .sig files
          # (raw 64-byte ed25519), the signed checksum manifest, the plain
          # checksums.txt for install-script verification, and the SBOM.
          # sort -u dedupes: platform globs already match their .sig sidecars.
          FILES=$(ls artifacts/agency-* artifacts/agency-*.sig artifacts/checksums.txt artifacts/checksums-signed.txt artifacts/agency.cdx.json 2>/dev/null | sort -u)
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            $FILES \
            --target "$GITHUB_SHA" \
            --title "Agency $TAG" \
            --generate-notes
